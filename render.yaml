# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: routy-backend
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    # requirements.txt is generated from uv.lock:
    #   uv export --format requirements-txt --no-dev --no-hashes -o requirements.txt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    # Only redeploy when backend code changes, not on mobile-only commits.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: '["*"]'
      # Secrets: Render asks for these when the Blueprint is first applied.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
